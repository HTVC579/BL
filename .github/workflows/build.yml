name: Build Extensions

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK & Generate Manifest
        run: |
          mkdir -p builds
          # Tự động tạo file plugins.json giả lập để Cloudstream nhận diện Repo
          echo '[{"name":"BLVietsub","url":"https://raw.githubusercontent.com/HTVC579/BL/builds/BLVietsub.apk","version":1}]' > builds/plugins.json

      - name: Deploy to builds branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./builds
          publish_branch: builds
